<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOG AI — Log In to SOC Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    .auth-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-header h2 {
      font-size: 1.6rem;
      font-weight: 800;
      color: #fff;
      margin-top: 0.5rem;
    }
    .auth-header p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }
    .form-group label {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-dim);
      letter-spacing: 0.5px;
    }
    .form-control {
      font-family: var(--font-sans);
      font-size: 0.9rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 14px;
      color: #fff;
      outline: none;
      transition: all 0.2s ease;
    }
    .form-control:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.25);
    }
    .btn-submit {
      width: 100%;
      font-family: var(--font-sans);
      font-size: 0.9rem;
      font-weight: 700;
      color: #070b14;
      background: var(--neon-cyan);
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
      transition: all 0.2s ease;
      margin-top: 0.5rem;
    }
    .btn-submit:hover {
      background: #38bdf8;
      box-shadow: 0 0 28px rgba(0, 240, 255, 0.5);
    }
    .error-banner {
      display: none;
      background: rgba(255, 42, 95, 0.15);
      border: 1px solid var(--neon-red);
      color: var(--neon-red);
      font-size: 0.8rem;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 1rem;
      text-align: center;
    }
    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .auth-footer a {
      color: var(--neon-cyan);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo-shield" style="margin: 0 auto;">
          <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.2" fill="none">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            <path d="m9 12 2 2 4-4"></path>
          </svg>
        </div>
        <h2>Log In to LOG AI</h2>
        <p>Enter your credentials to access the SOC Dashboard</p>
      </div>

      <div id="error-box" class="error-banner"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="username">USERNAME</label>
          <input type="text" id="username" class="form-control" placeholder="admin" required />
        </div>
        <div class="form-group">
          <label for="password">PASSWORD</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn-submit">Sign In to Dashboard</button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/register">Register here</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errBox = document.getElementById('error-box');
      errBox.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (res.ok && data.access_token) {
          localStorage.setItem('token', data.access_token);
          window.location.href = '/dashboard';
        } else {
          errBox.textContent = data.detail || 'Authentication failed. Invalid username or password.';
          errBox.style.display = 'block';
        }
      } catch (err) {
        errBox.textContent = 'Connection error. Please try again.';
        errBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
