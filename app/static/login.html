<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOG AI | Command Center Login</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23090d16'/><path d='M50 20 L25 30 L25 55 C25 70 35 85 50 90 C65 85 75 70 75 55 L75 30 Z' fill='%23a78bfa'/></svg>">
  <!-- Air-Gapped Self-Hosted Fonts & CSS -->
  <link rel="stylesheet" href="/style.css">
  <script>
    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.classList.add('light-mode');
      document.addEventListener('DOMContentLoaded', () => document.body.classList.add('light-mode'));
    }
  </script>
</head>
<body class="auth-page-body">

  <!-- Simplified Brand Header -->
  <header class="auth-header-nav" role="banner">
    <a href="/landing" class="auth-nav-brand">
      <img src="/vendor/icons/shield.svg" alt="" width="20" height="20" style="filter: invert(48%) sepia(85%) saturate(1450%) hue-rotate(170deg);">
      LOG AI
    </a>
    <span class="auth-nav-badge">SOC Access Only</span>
  </header>

  <!-- Main Section with Abstract Radial Cyber Glow -->
  <main class="auth-main-wrapper" id="main-content">
    <div class="auth-radial-bg"></div>

    <!-- Login Card Panel -->
    <div class="glass-panel-card" role="main">
      <div class="auth-card-header">
        <div class="auth-icon-box">
          <img src="/vendor/icons/lock.svg" alt="" width="22" height="22" style="filter: invert(48%) sepia(85%) saturate(1450%) hue-rotate(170deg);">
        </div>
        <h1 class="auth-title">Command Center Login</h1>
        <p class="auth-subtitle">Authenticate to access SOC telemetry.</p>
      </div>

      <div id="error-box" class="error-banner" style="display: none; background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #ffb4ab; font-size: 0.82rem; padding: 10px 14px; border-radius: 8px; margin-bottom: 1.25rem; text-align: center; font-weight: 600;"></div>

      <form id="login-form">
        <div class="input-cyber-group">
          <label for="username" class="input-cyber-label">Operator ID / Email</label>
          <div class="input-cyber-wrapper">
            <img src="/vendor/icons/user.svg" alt="" class="input-cyber-icon">
            <input type="text" id="username" name="username" class="input-cyber" placeholder="Enter credentials" required autocomplete="username" />
          </div>
        </div>

        <div class="input-cyber-group">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label for="password" class="input-cyber-label">Access Token</label>
            <a href="#" style="font-size: 0.72rem; color: var(--accent-hover); text-decoration: none; font-weight: 700;">Reset Token?</a>
          </div>
          <div class="input-cyber-wrapper">
            <img src="/vendor/icons/key.svg" alt="" class="input-cyber-icon">
            <input type="password" id="password" name="password" class="input-cyber" placeholder="••••••••••••" required autocomplete="current-password" />
          </div>
        </div>

        <div style="display: flex; align-items: center; gap: 8px; margin: 0.5rem 0 0.25rem 0;">
          <input type="checkbox" id="remember" style="width: 14px; height: 14px; accent-color: var(--accent-hover); cursor: pointer;" />
          <label for="remember" style="font-size: 0.78rem; color: var(--text-muted); cursor: pointer;">Maintain active session</label>
        </div>

        <button type="submit" id="login-btn" class="btn-cyber-primary">
          <span>Secure Login</span>
          <img src="/vendor/icons/arrow-right.svg" alt="" width="16" height="16" style="filter: invert(100%);">
        </button>
      </form>

      <div class="auth-divider">
        <div class="auth-divider-line"></div>
        <span class="auth-divider-tag">OR USE</span>
        <div class="auth-divider-line"></div>
      </div>

      <button type="button" class="btn-cyber-secondary" onclick="alert('Enterprise SSO Login is configured via SAML 2.0 / OIDC in enterprise self-hosted settings.')">
        <img src="/vendor/icons/shield.svg" alt="" width="15" height="15" style="filter: invert(60%);">
        Enterprise SSO Login
      </button>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.82rem; color: var(--text-muted);">
        Don't have an account? <a href="/register" style="color: var(--accent-hover); text-decoration: none; font-weight: 700;">Register here</a>
      </div>
    </div>
  </main>

  <footer class="app-footer-minimal" role="contentinfo" style="border-top: 1px solid var(--border-color); background: transparent; padding: 1.25rem 1.5rem; text-align: center; z-index: 10; position: relative;">
    <strong>LOG AI Security Platform</strong> &copy; 2026 LOG AI Inc. All rights reserved. Self-hosted air-gapped deployment architecture.
  </footer>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errBox = document.getElementById('error-box');
      errBox.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (res.ok && data.access_token) {
          sessionStorage.setItem('token', data.access_token);
          window.location.href = '/dashboard';
        } else {
          errBox.textContent = data.detail || 'Authentication failed. Invalid username or password.';
          errBox.style.display = 'block';
        }
      } catch (err) {
        errBox.textContent = 'Connection error. Please try again.';
        errBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
