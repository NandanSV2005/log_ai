<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOG AI | Analyst Registration</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23090d16'/><path d='M50 20 L25 30 L25 55 C25 70 35 85 50 90 C65 85 75 70 75 55 L75 30 Z' fill='%23a78bfa'/></svg>">
  <!-- Air-Gapped Self-Hosted Fonts & CSS -->
  <link rel="stylesheet" href="/style.css">
  <script>
    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.classList.add('light-mode');
      document.addEventListener('DOMContentLoaded', () => document.body.classList.add('light-mode'));
    }
  </script>
</head>
<body class="auth-page-body">

  <!-- Simplified Brand Header -->
  <header class="auth-header-nav" role="banner">
    <a href="/landing" class="auth-nav-brand">
      <img src="/vendor/icons/shield.svg" alt="" width="20" height="20" style="filter: invert(48%) sepia(85%) saturate(1450%) hue-rotate(170deg);">
      LOG AI
    </a>
    <span class="auth-nav-badge">SOC Access Only</span>
  </header>

  <!-- Main Section with Abstract Radial Cyber Glow -->
  <main class="auth-main-wrapper" id="main-content">
    <div class="auth-radial-bg"></div>

    <!-- Registration Card Panel -->
    <div class="glass-panel-card" role="main">
      <div class="auth-card-header">
        <div class="auth-icon-box">
          <img src="/vendor/icons/user.svg" alt="" width="22" height="22" style="filter: invert(48%) sepia(85%) saturate(1450%) hue-rotate(170deg);">
        </div>
        <h1 class="auth-title">Create an Account</h1>
        <p class="auth-subtitle">Register as a security analyst on LOG AI.</p>
      </div>

      <div id="error-box" class="error-banner"></div>
      <div id="success-box" class="success-banner"></div>

      <form id="register-form">
        <div class="input-cyber-group">
          <label for="username" class="input-cyber-label">USERNAME</label>
          <div class="input-cyber-wrapper">
            <img src="/vendor/icons/user.svg" alt="" class="input-cyber-icon">
            <input type="text" id="username" name="username" class="input-cyber" placeholder="new_analyst" required autocomplete="username" />
          </div>
        </div>

        <div class="input-cyber-group">
          <label for="password" class="input-cyber-label">PASSWORD</label>
          <div class="input-cyber-wrapper">
            <img src="/vendor/icons/key.svg" alt="" class="input-cyber-icon">
            <input type="password" id="password" name="password" class="input-cyber" placeholder="••••••••••••" required autocomplete="new-password" />
          </div>
        </div>

        <button type="submit" id="register-btn" class="btn-cyber-primary">
          <span>Create Account</span>
          <img src="/vendor/icons/arrow-right.svg" alt="" width="16" height="16" style="filter: invert(100%);">
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.82rem; color: var(--text-muted);">
        Already have an account? <a href="/login" style="color: var(--accent-hover); text-decoration: none; font-weight: 700;">Sign in</a>
      </div>
    </div>
  </main>

  <footer class="app-footer-minimal" role="contentinfo" style="border-top: 1px solid var(--border-color); background: transparent; padding: 1.25rem 1.5rem; text-align: center; z-index: 10; position: relative;">
    <strong>LOG AI Security Platform</strong> &copy; 2026 LOG AI Inc. All rights reserved. Self-hosted air-gapped deployment architecture.
  </footer>

  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errBox = document.getElementById('error-box');
      const succBox = document.getElementById('success-box');
      errBox.style.display = 'none';
      succBox.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/v1/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (res.ok) {
          succBox.textContent = 'Account created! Logging in automatically...';
          succBox.style.display = 'block';

          // Automatic second fetch to login endpoint
          const loginRes = await fetch('/api/v1/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          const loginData = await loginRes.json();

          if (loginRes.ok && loginData.access_token) {
            sessionStorage.setItem('token', loginData.access_token);
            window.location.href = '/dashboard';
          } else {
            window.location.href = '/login';
          }
        } else {
          errBox.textContent = data.detail || 'Registration failed.';
          errBox.style.display = 'block';
        }
      } catch (err) {
        errBox.textContent = 'Connection error. Please try again.';
        errBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
