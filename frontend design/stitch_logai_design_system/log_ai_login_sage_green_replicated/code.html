<style>
        .glass-panel {
            background: linear-gradient(145deg, #ffffff, #f4f4ef);
            border: 1px solid #e2e3de;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.05);
        }
        .input-cyber {
            background-color: #fafaf5;
            border: 1px solid #c5c8ba;
            background-image: radial-gradient(#e2e3de 1px, transparent 0);
            background-size: 8px 8px;
        }
        .input-cyber:focus {
            border-color: #718355;
            box-shadow: 0 0 0 1px #718355, 0 0 8px rgba(113, 131, 85, 0.1);
            outline: none;
        }
        .btn-primary {
            background-color: #516237;
            color: #ffffff;
            border: 1px solid #516237;
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            background-color: #697b4d;
            box-shadow: 0 0 12px rgba(113, 131, 85, 0.2);
        }
        .btn-secondary {
            background-color: transparent;
            color: #45483e;
            border: 1px solid #c5c8ba;
            transition: all 0.2s ease;
        }
        .btn-secondary:hover {
            color: #1a1c19;
            border-color: #75786d;
            background-color: #f4f4ef;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-base text-body-base overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Supressing TopNavBar as this is a linear/transactional login screen, but keeping a simplified brand header -->
<header class="w-full h-16 flex justify-between items-center px-lg max-w-container-max mx-auto absolute top-0 left-0 right-0 z-50">
<div class="font-headline-lg text-headline-lg font-extrabold text-primary tracking-tighter flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">security</span>
            LOG AI
        </div>
<div class="flex items-center gap-4 text-outline text-sm">
<span>SOC Access Only</span>
</div>
</header>
<main class="flex-grow flex items-center justify-center p-4 relative z-10">
<!-- Abstract Background Element -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none flex items-center justify-center opacity-30">
<div class="w-[800px] h-[800px] rounded-full bg-primary-container/10 blur-[120px]"></div>
<div class="absolute w-full h-full bg-[radial-gradient(circle_at_center,transparent_0%,#fafaf5_100%)]"></div>
</div>
<!-- Login Card -->
<div class="glass-panel w-full max-w-md rounded-xl p-8 relative z-10">
<!-- Header -->
<div class="text-center mb-8">
<div class="inline-flex items-center justify-center w-12 h-12 rounded-lg bg-surface-container border border-outline-variant mb-4 shadow-[0_0_15px_rgba(113,131,85,0.1)]">
<span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface mb-2">Command Center Login</h1>
<p class="text-on-surface-variant font-body-base">Authenticate to access SOC telemetry.</p>
</div>
<!-- Form -->
<form class="space-y-6" onsubmit="event.preventDefault();">
<div class="space-y-2">
<label class="block font-title-card text-title-card text-on-surface" for="username">Operator ID / Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-sm">person</span>
</div>
<input class="input-cyber w-full rounded-lg py-2.5 pl-10 pr-4 text-on-surface font-telemetry-mono text-telemetry-mono placeholder-outline transition-all" id="username" placeholder="Enter credentials" required="" type="text"/>
</div>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="block font-title-card text-title-card text-on-surface" for="password">Access Token</label>
<a class="text-xs text-primary hover:text-primary-container transition-colors font-body-bold" href="#">Reset Token?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-sm">key</span>
</div>
<input class="input-cyber w-full rounded-lg py-2.5 pl-10 pr-10 text-on-surface font-telemetry-mono text-telemetry-mono placeholder-outline transition-all" id="password" placeholder="••••••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-sm">visibility</span>
</button>
</div>
</div>
<div class="flex items-center">
<input class="h-4 w-4 rounded border-outline-variant bg-surface text-primary focus:ring-primary focus:ring-offset-background" id="remember" type="checkbox"/>
<label class="ml-2 block text-sm text-on-surface-variant" for="remember">Maintain active session</label>
</div>
<button class="btn-primary w-full rounded-lg py-3 font-body-bold text-body-bold flex items-center justify-center gap-2" type="submit">
                    Secure Login
                    <span class="material-symbols-outlined text-sm">login</span>
</button>
</form>
<div class="mt-8 flex items-center justify-center gap-4">
<div class="h-px bg-outline-variant flex-grow"></div>
<span class="text-xs text-outline font-badge-caps text-badge-caps">OR USE</span>
<div class="h-px bg-outline-variant flex-grow"></div>
</div>
<div class="mt-6">
<button class="btn-secondary w-full rounded-lg py-2.5 font-body-bold text-body-bold flex items-center justify-center gap-2" type="button">
<span class="material-symbols-outlined text-sm">business</span>
                    Enterprise SSO Login
                </button>
</div>
</div>
</main>
<!-- Suppressing Footer as this is a transactional screen, keeping minimal copyright -->
<footer class="w-full py-4 text-center text-outline font-telemetry-mono text-[10px] relative z-10 border-t border-outline-variant/50">
        © 2024 Log AI Security. Authorized Personnel Only.
    </footer>
</body></html>
